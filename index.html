<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>유튜브 데이터 수집기 설정 도구</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700&display=swap');
        body { 
            font-family: 'Pretendard', sans-serif; 
            -webkit-tap-highlight-color: transparent;
            font-size: 16px; /* 기본 폰트 크기 상향 */
        }
        /* 스마트폰 앱 느낌을 주기 위한 스크롤바 숨김 */
        ::-webkit-scrollbar { display: none; }
        input::placeholder { font-size: 15px; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col items-center">

    <!-- Mobile Container -->
    <div class="w-full max-w-md bg-white min-h-screen shadow-2xl flex flex-col">
        
        <!-- App Header -->
        <header class="bg-red-600 pt-12 pb-8 px-6 text-white rounded-b-[2.5rem] shadow-lg">
            <div class="flex items-center gap-4 mb-3">
                <div class="p-3 bg-white/20 rounded-xl">
                    <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" fill="white" viewBox="0 0 16 16">
                        <path d="M8.051 1.999h.089c.822.003 4.987.033 6.11.335a2.01 2.01 0 0 1 1.415 1.42c.101.38.172.883.22 1.402l.01.104.022.26.008.104c.065.914.073 1.77.074 1.957v.075c-.001.194-.01 1.108-.082 2.06l-.008.105-.009.104c-.05.572-.124 1.14-.235 1.558a2.007 2.007 0 0 1-1.415 1.42c-1.16.312-5.569.334-6.18.335h-.142c-.309 0-1.587-.006-2.927-.052l-.17-.006-.087-.004-.171-.007-.171-.007c-1.11-.049-2.167-.128-2.654-.26a2.007 2.007 0 0 1-1.415-1.419c-.111-.417-.185-.986-.235-1.558L.09 9.82l-.008-.104A31.4 31.4 0 0 1 0 7.68v-.123c.002-.215.01-.958.064-1.778l.007-.103.003-.052.008-.104.022-.26.01-.104c.048-.519.119-1.023.22-1.402a2.007 2.007 0 0 1 1.415-1.42c.487-.13 1.544-.21 2.654-.26l.17-.007.172-.006.086-.003.171-.007A99.788 99.788 0 0 1 7.858 2h.193zM6.4 5.209v4.818l4.157-2.408L6.4 5.209z"/>
                    </svg>
                </div>
                <h1 class="text-2xl font-bold tracking-tight">유튜브 데이터 수집기</h1>
            </div>
            <p class="text-red-100 text-base font-medium opacity-90">댓글 3,000개 추출 및 모바일 다운로드 지원</p>
        </header>

        <!-- Main Content -->
        <main class="flex-grow p-6 space-y-10">
            
            <!-- Step 1: Card Style Link -->
            <section class="space-y-4">
                <div class="flex items-center gap-3 mb-1">
                    <span class="flex items-center justify-center w-7 h-7 bg-red-600 text-white text-xs font-bold rounded-full shadow-sm">1</span>
                    <h2 class="text-lg font-bold text-gray-800">API 키 발급</h2>
                </div>
                <a href="https://console.cloud.google.com/apis/credentials?project=gen-lang-client-0607796199" target="_blank" rel="noopener noreferrer" class="block bg-gray-50 border-2 border-gray-100 p-5 rounded-3xl hover:bg-gray-100 active:scale-[0.97] transition-all">
                    <div class="flex justify-between items-center">
                        <div>
                            <span class="text-gray-900 font-bold text-lg block mb-1">인증 정보 페이지 이동</span>
                            <span class="text-sm text-gray-500 leading-tight">구글 클라우드 콘솔에서 API 키를 생성하세요.</span>
                        </div>
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
                        </svg>
                    </div>
                </a>
            </section>

            <!-- Step 2 & 3: Input Forms -->
            <section class="space-y-8">
                <!-- API Key Input -->
                <div class="space-y-3">
                    <div class="flex items-center gap-3 mb-1">
                        <span class="flex items-center justify-center w-7 h-7 bg-red-600 text-white text-xs font-bold rounded-full shadow-sm">2</span>
                        <h2 class="text-lg font-bold text-gray-800">API 키 입력</h2>
                    </div>
                    <input type="text" id="apiKey" placeholder="AIza... 로 시작하는 키를 입력하세요" class="w-full px-5 py-5 bg-gray-50 border-2 border-gray-100 rounded-2xl focus:ring-2 focus:ring-red-500 focus:bg-white outline-none transition-all text-base font-mono shadow-sm">
                    <p class="text-[11px] text-gray-400 px-2 leading-relaxed font-medium">※ 입력 후 칸 외부를 누르면 보안을 위해 마지막 10글자가 숨겨집니다.</p>
                </div>

                <!-- Video URL Input -->
                <div class="space-y-3">
                    <div class="flex items-center gap-3 mb-1">
                        <span class="flex items-center justify-center w-7 h-7 bg-red-600 text-white text-xs font-bold rounded-full shadow-sm">3</span>
                        <h2 class="text-lg font-bold text-gray-800">유튜브 영상 주소</h2>
                    </div>
                    <input type="text" id="videoUrl" placeholder="https://www.youtube.com/watch?v=..." class="w-full px-5 py-5 bg-gray-50 border-2 border-gray-100 rounded-2xl focus:ring-2 focus:ring-red-500 focus:bg-white outline-none transition-all text-base shadow-sm">
                </div>
            </section>

            <!-- Status Message -->
            <div id="statusMessage" class="hidden text-center text-sm font-bold p-5 rounded-2xl animate-pulse"></div>

        </main>

        <!-- Footer Actions -->
        <footer class="p-6 bg-white border-t border-gray-100 space-y-4 pb-12 shadow-[0_-4px_20px_-5px_rgba(0,0,0,0.05)]">
            <button id="copyBtn" class="w-full bg-red-600 text-white font-bold py-5 rounded-2xl shadow-xl shadow-red-100 active:scale-95 transition-all flex items-center justify-center gap-3 text-lg">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3" />
                </svg>
                코드 생성 및 복사하기
            </button>
            
            <a href="https://colab.research.google.com/notebooks/welcome.ipynb" id="colabLink" target="_blank" rel="noopener noreferrer" class="w-full bg-orange-500 text-white font-bold py-5 rounded-2xl shadow-xl shadow-orange-100 active:scale-95 transition-all flex items-center justify-center gap-3 text-lg">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4" />
                </svg>
                Google Colab 실행하기
            </a>
        </footer>
    </div>

    <!-- Hidden Copy Target -->
    <textarea id="hiddenTextarea" class="fixed opacity-0 pointer-events-none"></textarea>

    <script>
        let rawApiKey = "";

        const pythonTemplate = `
# 1. 필수 라이브러리 설치
!pip install google-api-python-client pandas openpyxl

import re
import os
import pandas as pd
import base64
from googleapiclient.discovery import build
from IPython.display import HTML, display

# ==========================================
# 설정: 주입된 정보
# ==========================================
API_KEY = "{API_KEY}"
TARGET_URL = "{VIDEO_URL}"

def extract_video_id(url):
    regex = r"(?:v=|\\/)([0-9A-Za-z_-]{11}).*"
    match = re.search(regex, url)
    if match: return match.group(1)
    return None

def get_video_comments(video_id):
    """최대 3,000개의 댓글을 수집합니다."""
    youtube = build("youtube", "v3", developerKey=API_KEY)
    comments = []
    try:
        request = youtube.commentThreads().list(
            part="snippet",
            videoId=video_id,
            maxResults=100,
            textFormat="plainText"
        )
        while request:
            response = request.execute()
            for item in response['items']:
                comment = item['snippet']['topLevelComment']['snippet']
                comments.append({
                    "작성자": comment['authorDisplayName'],
                    "댓글 내용": comment['textDisplay'],
                    "좋아요 수": comment['likeCount'],
                    "작성일": comment['publishedAt']
                })
            request = youtube.commentThreads().list_next(request, response)
            if len(comments) >= 3000:
                break
        return comments
    except Exception as e:
        print(f"댓글 수집 오류: {e}")
        return []

def run_collector():
    print("🚀 유튜브 댓글 수집 엔진 가동...")
    video_id = extract_video_id(TARGET_URL)
    if not video_id:
        print("❌ 유효하지 않은 URL입니다.")
        return
    print(f"✅ 대상 영상 ID: {video_id}")
    
    print(f"\\n[진행] 댓글(최대 3,000개) 수집 중...")
    comments = get_video_comments(video_id)
    
    if not comments:
        print("\\n⚠️ 수집된 댓글이 없습니다.")
        return
        
    file_name = f"youtube_comments_{video_id}.xlsx"
    pd.DataFrame(comments).to_excel(file_name, index=False)
            
    print(f"🎉 결과 저장 완료: '{file_name}'")
    
    # 모바일 및 PC 자동 다운로드 시도
    try:
        from google.colab import files
        print("\\n📥 자동 다운로드를 시도합니다...")
        files.download(file_name)
    except:
        pass
        
    # 모바일 다운로드 수동 링크 생성 (매우 중요)
    print("\\n🔗 자동 다운로드가 되지 않을 경우 아래 링크를 눌러주세요:")
    with open(file_name, 'rb') as f:
        data = f.read()
    b64 = base64.b64encode(data).decode()
    payload = f'data:application/vnd.openxmlformats-officedocument.spreadsheetml.sheet;base64,{b64}'
    html = f'''
    <div style="padding: 15px; background: #fff; border: 2px solid #ff4b4b; border-radius: 12px; margin-top: 10px; text-align: center;">
        <a href="{payload}" download="{file_name}" style="color: #ff4b4b; font-weight: bold; text-decoration: none; font-size: 18px;">
            [ 여기를 클릭하여 엑셀 파일 다운로드 ]
        </a>
    </div>
    '''
    display(HTML(html))

if __name__ == "__main__":
    run_collector()
`;

        const copyBtn = document.getElementById('copyBtn');
        const apiKeyInput = document.getElementById('apiKey');
        const videoUrlInput = document.getElementById('videoUrl');
        const statusMessage = document.getElementById('statusMessage');
        const hiddenTextarea = document.getElementById('hiddenTextarea');

        // 마스킹 로직: 마지막 10글자 숨김
        function getMaskedValue(value) {
            if (value.length > 10) {
                return value.slice(0, -10) + "**********";
            } else if (value.length > 0) {
                return "*".repeat(value.length);
            }
            return "";
        }

        apiKeyInput.addEventListener('input', (e) => { rawApiKey = e.target.value; });
        apiKeyInput.addEventListener('focus', (e) => { e.target.value = rawApiKey; });
        apiKeyInput.addEventListener('blur', (e) => { e.target.value = getMaskedValue(rawApiKey); });

        function showStatus(msg, isError = false) {
            statusMessage.textContent = msg;
            statusMessage.className = `block text-center text-sm font-bold p-5 rounded-2xl ${isError ? 'bg-red-50 text-red-600' : 'bg-green-50 text-green-600'}`;
            setTimeout(() => { statusMessage.className = 'hidden'; }, 5000);
        }

        copyBtn.addEventListener('click', () => {
            const videoUrl = videoUrlInput.value.trim();
            if (!rawApiKey || !videoUrl) {
                showStatus('API 키와 주소를 모두 입력해 주세요.', true);
                return;
            }
            let finalCode = pythonTemplate.replace('{API_KEY}', rawApiKey).replace('{VIDEO_URL}', videoUrl);
            hiddenTextarea.value = finalCode;
            hiddenTextarea.select();
            
            try {
                // 모바일 대응 클립보드 복사
                const successful = document.execCommand('copy');
                if (successful) {
                    showStatus('코드가 복사되었습니다! 아래 버튼을 눌러 코랩에서 실행하세요.');
                    copyBtn.innerHTML = '복사 완료!';
                    setTimeout(() => { copyBtn.innerHTML = '코드 생성 및 복사하기'; }, 2000);
                }
            } catch (err) {
                showStatus('복사 중 오류가 발생했습니다. 수동으로 복사해 주세요.', true);
            }
        });
    </script>
</body>
</html>
